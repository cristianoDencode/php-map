# Testes em Linux e Windows. Sem segredos: os testes `remote_db` (banco remoto) ficam de fora.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint e tipos
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
      - name: Testes (sem Docker e sem banco remoto)
        run: pytest -q -m "not docker and not remote_db"

  extractor:
    # O runner Windows não roda containers Linux: o extrator real só é testado no Ubuntu.
    name: Extrator PHP (Docker, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev,mcp]"
      - name: Imagem e dependências do extrator
        run: php-map setup-extractor --build-image
      - name: Testes com o extrator real
        # Um teste pulado aqui seria um falso verde: a imagem acabou de ser construída.
        shell: bash  # com pipefail: a falha do pytest não se perde no `tee`
        run: |
          pytest -q -m docker -rs | tee docker-tests.log
          if grep -q "skipped" docker-tests.log; then
            echo "::error::testes com Docker pulados"
            exit 1
          fi
      - name: Scan do projeto de exemplo
        run: |
          php-map scan --source tests/fixtures/zend1-mini --profile zend1 --schema tests/fixtures/schema/zend1_mini.sql --out out/mini
          python -c "import json; s = json.load(open('out/mini/scan_summary.json', encoding='utf-8')); print(s['files']); assert s['files']['extractor_image'] == 'php-map-php74'"

  ui:
    name: Interface (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
