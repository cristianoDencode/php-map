type Query {
  """Tokens do MCP (nunca o valor, só o prefixo)."""
  accessTokens: [AccessToken!]!

  """Usuários do login da interface (nunca a senha)."""
  accessUsers: [AccessUser!]!

  """
  O MCP montado em `/mcp`: estado, endereços, código-fonte e tokens ativos.
  """
  mcpStatus: McpStatus!

  """A configuração do túnel (só nomes de variáveis) e os exemplos prontos."""
  tunnelConfig: TunnelConfigInfo!

  """
  Estado do túnel: etapa, URL pública do MCP, log mascarado e achados de segredo.
  """
  tunnelStatus: TunnelStatus!

  """Contagens do scan (por label, tipo e fonte) e o `meta`."""
  stats: JSON!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node!]!

  """Busca textual."""
  search(text: String!, label: String = null, module: String = null, limit: Int! = 20, anyTerm: Boolean! = false): [SearchHit!]!

  """Sugestões enquanto se digita (Ctrl+K): a busca por prefixo."""
  suggest(prefix: String!, limit: Int! = 8, label: String = null): [SearchHit!]!

  """Da tela até o banco (a mesma BFS do `php-map trace`)."""
  trace(entry: String!, depth: Int! = 8, minConfidence: Float! = 0, includeInfra: Boolean! = false, expandPgFunctions: Boolean! = false, maxNodes: Int! = 500): Subgraph!

  """Quem é afetado por uma tabela (a BFS do `php-map impact`)."""
  impact(table: String!, schema: String = null, depth: Int! = 10, minConfidence: Float! = 0, includeInfra: Boolean! = false, maxNodes: Int! = 500): Subgraph!

  """Diagrama Mermaid de `trace` (root = arquivo) ou `impact`."""
  mermaid(kind: String!, root: String!, depth: Int! = 6, maxNodes: Int! = 60, minConfidence: Float! = 0, includeInfra: Boolean! = false, expandPgFunctions: Boolean! = false): String!

  """
  Ficha de regras de negócio de uma tela: menus, ações, mensagens, dados gravados e lidos, funções do banco e triggers, com arquivo e linha.
  """
  businessRules(entry: String!, depth: Int! = 4, minConfidence: Float! = 0.5): BusinessRules!

  """
  Autocompletar da tela Menus por fonte: arquivos cujo caminho contém o texto (mínimo de 2 caracteres), os que casam pelo nome primeiro.
  """
  findFiles(text: String!, limit: Int! = 10): [ID!]!

  """
  Menus do e-cidade que chegam a um fonte: a busca reversa a partir do arquivo e do que ele declara, com a distância e o caminho de cada menu.
  """
  menusForFile(file: String!, maxDistance: Int! = 5, module: String = null, text: String = null): FileMenus!

  """
  Camadas de um fonte: os caminhos até o menu (tela, JS, rota, controller) e o que ele alcança (service, repository, model, tabela). A camada é deduzida do nome.
  """
  layers(path: String!, minConfidence: Float! = 0.5): FileLayers!

  """Módulos com Ca, Ce e instabilidade."""
  modules: [ModuleStats!]!
  module(id: ID!): ModuleDetail
  moduleEdges(kind: String = null, minWeight: Float! = 0): [ModuleEdge!]!
  tables(shared: Boolean = null, module: String = null, limit: Int! = 100, offset: Int! = 0): [TableStats!]!
  hotspots(label: String = null, module: String = null, limit: Int! = 50): [Hotspot!]!

  """Total de tabelas com os mesmos filtros de `tables` (para paginar)."""
  tablesTotal(shared: Boolean = null, module: String = null): Int!
  screens(inMenu: Boolean = null, module: String = null, limit: Int! = 100, offset: Int! = 0): [ScreenStats!]!

  """Texto de uma função da base. Nulo se a função não tem texto no grafo."""
  routineSource(id: ID!, offset: Int! = 1, limit: Int! = 200): RoutineSource

  """Origem de uma função da base. Nulo sem a tabela ou sem a função."""
  routineOrigin(id: ID!): RoutineOrigin

  """
  O grafo servido tem a origem das funções (grafo escaneado com a origem).
  """
  hasRoutineOrigins: Boolean!

  """
  O grafo servido tem o texto das funções da base (escaneado com o banco).
  """
  hasRoutineTexts: Boolean!

  """Pasta do e-cidade em uso."""
  workspace: Workspace!

  """Arquivo da pasta do e-cidade (só leitura)."""
  sourceFile(path: String!, line: Int = null, context: Int! = 30): SourceFile!

  """Projetos cadastrados. Mesmo sem grafo, aparecem na lista."""
  projects: [Project!]!

  """O projeto ativo: o que o servidor serve. Nulo sem nenhum projeto."""
  activeProject: Project

  """Perfis disponíveis e o arquivo que cada um exige na raiz da pasta."""
  projectProfiles: [ProfileOption!]!

  """
  Sugere o perfil de uma pasta pelos marcadores. A confirmação é do usuário.
  """
  suggestProfile(source: String!): ProfileSuggestion!

  """
  Superfície de comunicação: endpoints SOAP/RPC e rotas HTTP numa lista só, filtrada e paginada aqui. `protocol` aceita soap, rpc, http e externo.
  """
  communication(system: String = null, protocol: String = null, direction: String = null, module: String = null, search: String = null, limit: Int! = 50, offset: Int! = 0): CommunicationPage!

  """Detalhe de um endpoint ou rota, com o outro lado da costura (cross)."""
  endpointDetail(id: ID!): EndpointDetail!

  """Scan pela interface: o atual ou o último. Consultado a cada 2 s."""
  scanJob: ScanJob

  """Valores iniciais do formulário de scan e o que está disponível."""
  scanDefaults: ScanDefaults!

  """Extração (cache de AST) desta pasta no `out` do servidor."""
  astCache(source: String!): AstCache!
}

