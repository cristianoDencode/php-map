type SearchHit {
  nodeId: ID!
  label: String!
  modules: [String!]!
  score: Float!
  matched: Int!
  field: String!
  snippet: String!
  nextCommand: String!
}

type SourceFile {
  path: String!
  totalLines: Int!
  startLine: Int!
  lines: [String!]!
  highlight: Int
  truncated: Boolean!
  sizeBytes: Int!
}

type Subgraph {
  root: ID!
  nodes: [Node!]!
  edges: [Edge!]!
  depthOf: JSON!

  """Pai de cada nó na busca (o nó mais perto da raiz); a raiz não aparece."""
  parentOf: JSON!
  truncated: Boolean!
  summary: JSON!

  """Só no impacto: quem chama o DAO (`cl_*`) que toca a tabela."""
  daoUsers: [DaoUser!]!
}

type TableStats {
  tableId: ID!
  ownerModules: [String!]!
  readerModules: JSON!
  writerModules: JSON!
  readers: Int!
  writers: Int!
  shared: Boolean!
}

type TunnelConfigInfo {
  configured: Boolean!
  command: [String!]!
  publicUrl: String
  urlRegex: String!
  env: [TunnelEnvVar!]!
  examples: [TunnelExample!]!
}

type TunnelEnvVar {
  name: String!
  defined: Boolean!
}

type TunnelExample {
  id: String!
  label: String!
  command: [String!]!
  publicUrl: String
  urlRegex: String!
  envNames: [String!]!
}

type TunnelFinding {
  kind: String!
  where: String!
  masked: String!
  hash: String!
}

type TunnelStatus {
  state: String!
  stage: String
  stageLabel: String
  url: String
  publicHost: String
  error: String
  log: [String!]!
  findings: [TunnelFinding!]!
  elapsedSeconds: Int!
  canStart: Boolean!
  blockedReason: String
}

type ViaStep {
  node: ID!
  label: String!
  edgeType: String
  confidence: Float
  path: String
  line: Int
  incoming: Boolean!
}

type Workspace {
  source: String
  origin: String!
  exists: Boolean!
  isEcidade: Boolean!
  graphSource: String

  """Arquivo que o perfil exige na raiz da pasta."""
  marker: String!
}
