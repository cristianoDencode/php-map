type Mutation {
  """
  Cria um token do MCP. `expiresDays` ∈ 30, 90, 180, 365 ou nulo (sem validade).
  """
  createAccessToken(name: String!, expiresDays: Int = 90): CreatedAccessToken!

  """Revoga o token: a próxima chamada do cliente recebe 401."""
  revokeAccessToken(id: Int!): AccessToken!

  """
  Cria um usuário (senha com pelo menos 10 caracteres). `role`: `admin` ou `leitor` (padrão `leitor`, que só consulta).
  """
  addAccessUser(username: String!, password: String!, role: String! = "leitor"): AccessUser!

  """
  Troca o papel do usuário. Não deixa rebaixar o último administrador ativo.
  """
  setAccessUserRole(username: String!, role: String!): AccessUser!

  """
  Desativa o usuário. Não deixa desativar a si mesmo nem o último administrador.
  """
  disableAccessUser(username: String!): AccessUser!

  """Reativa um usuário desativado."""
  enableAccessUser(username: String!): AccessUser!

  """Define uma senha nova para o usuário (e desbloqueia a conta)."""
  resetAccessUserPassword(username: String!, password: String!): AccessUser!

  """
  Liga ou desliga a leitura do código-fonte pelo MCP (desligada por padrão).
  """
  setMcpExposeSource(expose: Boolean!): McpStatus!

  """
  Grava o comando do túnel (`{port}` e `{host}` são trocados) e os NOMES das variáveis.
  """
  saveTunnelConfig(command: [String!]!, publicUrl: String = null, urlRegex: String = null, envNames: [String!] = null): TunnelConfigInfo!

  """
  Sobe o túnel: pré-checagens, varredura de segredos, URL pública e health.
  """
  startTunnel: TunnelStatus!

  """Para o túnel (mata o processo e tira o host público)."""
  stopTunnel: TunnelStatus!

  """Valida a pasta do e-cidade e passa a usá-la (código-fonte e scan)."""
  setSource(path: String!): Workspace!

  """Inicia o scan num subprocesso (um por vez)."""
  startScan(input: ScanInput!): ScanJob!

  """
  Cadastra um projeto. A pasta é validada pelo marcador do perfil escolhido; `dsnEnv` é o NOME da variável do .env, nunca a conexão.
  """
  addProject(input: ProjectInput!): Project!

  """Altera o cadastro de um projeto. Só os campos informados mudam."""
  updateProject(slug: String!, input: ProjectUpdate!): Project!

  """
  Tira um projeto da lista (os arquivos dele ficam em disco). Não remove o ativo.
  """
  removeProject(slug: String!): [Project!]!

  """
  Passa a servir o grafo do projeto (outro arquivo, nunca o mesmo trocado).
  """
  setActiveProject(slug: String!): Project!

  """Cancela o scan em andamento (processo e containers do job)."""
  cancelScan: ScanJob!
}

